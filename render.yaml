# Render lee este archivo y configura el servicio solo.
# Subir a la raíz del repo. En Render: New > Blueprint > elige tu repo.
services:
  - type: web
    name: mandados-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npx prisma generate && npx nest build && npx prisma db push --accept-data-loss && node dist/main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_MAPS_KEY
        sync: false
      - key: PORT
        value: "4000"